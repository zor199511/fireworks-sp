[project]
name = "fireworks-sp"
version = "0.1.0"
description = "Fireworks Stock Picker - daily A-share candidate pool with explainable scoring, backtest and dashboard"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.16",
    "baostock>=0.8.9",
    "pandas>=2.2",
    "plotly>=5.24",
    "streamlit>=1.40",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
